<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postlar ro‘yxati</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f8fafc; color: #0f172a; padding: 24px; }
        .container { max-width: 900px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 16px; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0;
            flex-wrap: wrap; gap: 10px;
        }
        .badge {
            background: #eff6ff; color: #1d4ed8; padding: 6px 12px;
            border-radius: 20px; font-size: 0.85rem; border: 1px solid #bfdbfe;
        }
        .meta-info { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; }

        .posts-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }
        .card {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
            overflow: hidden; text-decoration: none; color: inherit;
            display: flex; flex-direction: column; transition: 0.2s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        .card img { width: 100%; height: 170px; object-fit: cover; background: #e2e8f0; }
        .card-body { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; }
        .card-text {
            color: #475569; font-size: 0.92rem; margin-bottom: 16px;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-link { margin-top: auto; color: #2563eb; font-weight: 600; font-size: 0.9rem; }

        .empty-box {
            text-align: center; padding: 50px 20px; background: #fff;
            border: 1px dashed #cbd5e1; border-radius: 12px; color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Postlar (<span id="post-count">0</span>)</h1>
        <div class="badge" id="api-message">API ulanmoqda...</div>
    </header>

    <div class="meta-info" id="api-timestamp"></div>

    <!-- Xabarlar (yuklanish, bo'sh ro'yxat yoki xatolik) -->
    <div id="status-box" class="empty-box">Ma’lumotlar yuklanmoqda...</div>

    <!-- Postlar ro'yxati -->
    <div id="posts-grid" class="posts-grid"></div>
</div>

<script>
    // O'zingizning haqiqiy API manzilingizni shu yerga yozing:
    const API_URL = "http://127.0.0.1:8000/api/posts/";

    async function loadPosts() {
        const statusBox = document.getElementById("status-box");
        const postsGrid = document.getElementById("posts-grid");
        const messageEl = document.getElementById("api-message");
        const countEl = document.getElementById("post-count");
        const timeEl = document.getElementById("api-timestamp");

        try {
            const response = await fetch(API_URL, {
                method: "GET",
                headers: { "Accept": "application/json" }
            });

            const result = await response.json();

            // Sizning API strukturangiz: status, message, timestamp, data.count, data.posts
            messageEl.textContent = `HTTP ${result.status} • ${result.message}`;
            countEl.textContent = result.data?.count ?? 0;

            if (result.timestamp) {
                timeEl.textContent = "Server vaqti: " + new Date(result.timestamp).toLocaleString("uz-UZ");
            }

            const posts = result.data?.posts || [];

            if (posts.length === 0) {
                statusBox.style.display = "block";
                statusBox.innerHTML = "<h3>Hozircha postlar yo‘q</h3><p>Serverdan bo‘sh ro‘yxat (count: 0) qaytdi.</p>";
                postsGrid.innerHTML = "";
                return;
            }

            statusBox.style.display = "none";
            postsGrid.innerHTML = posts.map(post => {
                const title = post.title || post.name || "Sarlavhasiz";
                const content = post.content || post.body || post.description || "";
                const image = post.image || post.thumbnail || "";

                return `
                    <a href="detail.html?id=${post.id}" class="card">
                        ${image ? `<img src="${image}" alt="${title}">` : ""}
                        <div class="card-body">
                            <h2 class="card-title">${title}</h2>
                            <p class="card-text">${content}</p>
                            <span class="card-link">Batafsil o‘qish →</span>
                        </div>
                    </a>
                `;
            }).join("");

        } catch (error) {
            messageEl.textContent = "Xatolik yuz berdi";
            statusBox.style.display = "block";
            statusBox.innerHTML = `<h3>API bilan bog‘lanib bo‘lmadi</h3><p>${error.message}</p>`;
        }
    }

    loadPosts();
</script>

</body>
</html>
